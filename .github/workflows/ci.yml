name: Laboratorios verificables
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  core-and-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Pruebas de decisiones y contratos
        run: python3 -m unittest discover -s tests -v
      - name: Sintaxis de interfaz y recurso visual complementario
        run: |
          node --check web/game.js
          node --check web/advanced.js
          node tests/advanced-ui.mjs
          node --check tests/ui.mjs
          node scripts/build-context-figure.mjs --audit
      - name: Contrato de aislamiento
        run: docker compose --profile '*' config --format json | python3 scripts/verify_compose.py
      - name: Iniciar empresa y puestos internos
        env:
          LAB_SKIP_AI: "1"
        run: ./lab.sh up
      - name: Pruebas integradas reales
        run: ./lab.sh smoke
      - name: Llaves, autenticación y límites del acceso SSH
        run: python3 -m tests.integration_ssh
      - name: Juego real por SSH desde la terminal del alumno
        run: python3 tests/integration_game.py --ssh
      - name: Continuación real con ZAP y controles causales
        run: |
          ./lab.sh webscan-on
          python3 -m tests.integration_advanced
      - name: Rutas desde dos zonas
        run: |
          ./lab.sh discover public > /tmp/public.json
          ./lab.sh discover support > /tmp/support.json
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/public.json'));s=json.load(open('/tmp/support.json'))
          assert [x['target'] for x in p['targets'] if x['result']=='reachable']==['gateway']
          assert [x['target'] for x in s['targets'] if x['result']=='reachable']==['backup']
          PY
      - name: Detener proyecto
        if: always()
        run: docker compose --profile ai --profile tools --profile scanners --profile webscan down
