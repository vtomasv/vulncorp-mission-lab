name: vulncorp-mission

x-common: &common
  image: vulncorp-core:0.1.0
  build:
    context: .
    target: core
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 96
  cpus: 0.50
  mem_limit: 160m
  tmpfs: ["/tmp:size=32m,mode=1777"]
  restart: unless-stopped
  volumes: [lab_secrets:/secrets:ro]
  depends_on:
    init-game: {condition: service_completed_successfully}

services:
  mission:
    <<: *common
    ports: ["127.0.0.1:${LAB_PORT:-8095}:8000", "127.0.0.1:${LAB_SSH_PORT:-2222}:2222"]
    networks: [ui, edge, app, support, ai, php]
    volumes: [mission_state:/state, lab_secrets:/secrets:ro]
    mem_limit: 256m
    cpus: 1.0
    environment:
      LAB_SECRET_DIR: /secrets
      LAB_DB: /state/mission.db
      LAB_SSH_PORT: ${LAB_SSH_PORT:-2222}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:1.7b}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  gateway:
    <<: *common
    command: [python, -m, app.targets]
    environment: {LAB_ROLE: gateway, LAB_SECRET_DIR: /secrets}
    networks: [edge, app]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6

  records:
    <<: *common
    image: vulncorp-records:0.1.0
    build: {context: ., target: records}
    command: [python, -m, app.targets]
    environment: {LAB_ROLE: records, LAB_SECRET_DIR: /secrets}
    networks: [app]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health',timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6

  backup:
    <<: *common
    command: [python, -m, app.targets]
    environment: {LAB_ROLE: backup, LAB_SECRET_DIR: /secrets}
    networks: [support]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/health',timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6

  validation:
    <<: *common
    command: [python, -m, app.range_target]
    environment: {LAB_SECRET_DIR: /secrets, LAB_RANGE_STATE: /range-state/validation.json}
    volumes: [lab_secrets:/secrets:ro, range_state:/range-state]
    networks: [app]
    mem_limit: 128m
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8083/health',timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6

  collector:
    <<: *common
    command: [python, -m, app.range_target]
    environment: {LAB_RANGE_ROLE: collector, LAB_SECRET_DIR: /secrets, LAB_RANGE_STATE: /range-state/collector.json}
    volumes: [lab_secrets:/secrets:ro, range_state:/range-state]
    networks: [app]
    mem_limit: 96m
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8084/health',timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6

  webscan:
    image: ghcr.io/zaproxy/zaproxy:stable@sha256:5ccfff9a411743ab2615136a2edd7416bec9ce41572fa94e935df38c14adb2b6
    profiles: [webscan]
    command: [zap.sh, -daemon, -host, 0.0.0.0, -port, "8080", -config, api.key=training-zap-local-only, -config, api.addrs.addr.name=.*, -config, api.addrs.addr.regex=true, -config, autoupdate.checkOnStart=false, -config, autoupdate.downloadNewRelease=false, -config, autoupdate.installAddonUpdates=false]
    environment: {JAVA_OPTS: "-Xmx512m", HOME: /home/zap}
    volumes: [zap_work:/home/zap]
    networks: [app]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 1.0
    pids_limit: 128
    tmpfs: ["/tmp:size=96m,mode=1777"]
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "2"}
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/JSON/core/view/version/?apikey=training-zap-local-only',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s

  php-legacy:
    image: vulncorp-php-legacy:0.4.0
    build:
      context: .
      dockerfile: php/Dockerfile
      args:
        PHP_IMAGE: php:8.4.26-apache-bookworm@sha256:52f04cd1e398edd0f80afa8330ce73bce61931ddbd0d5bdd919c6f914d02bcf8
        PHP_BASE_DIGEST: sha256:52f04cd1e398edd0f80afa8330ce73bce61931ddbd0d5bdd919c6f914d02bcf8
    profiles: [php]
    networks: [php]
    volumes: [php_key:/php-secret:ro, php_data:/php-data]
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 192m
    memswap_limit: 192m
    cpus: 0.50
    pids_limit: 32
    tmpfs: ["/tmp:size=24m,mode=1777"]
    depends_on:
      init-game: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, curl, -fsS, "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 4s
      retries: 8
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "2"}
    restart: unless-stopped

  php-patched:
    image: vulncorp-php-patched:0.4.0
    build:
      context: .
      dockerfile: php/Dockerfile
      args:
        PHP_IMAGE: php:8.4.27-apache-bookworm@sha256:e653ff90d7f6e2e6f81eddb07c864f1eae224ccbf5143f82a44f25e2f110e320
        PHP_BASE_DIGEST: sha256:e653ff90d7f6e2e6f81eddb07c864f1eae224ccbf5143f82a44f25e2f110e320
    profiles: [php]
    networks: [php]
    volumes: [php_key:/php-secret:ro, php_data:/php-data]
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 192m
    memswap_limit: 192m
    cpus: 0.50
    pids_limit: 32
    tmpfs: ["/tmp:size=24m,mode=1777"]
    depends_on:
      init-game: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, curl, -fsS, "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 4s
      retries: 8
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "2"}
    restart: unless-stopped

  init-game:
    image: vulncorp-core:0.1.0
    command: [python, -m, app.init_game]
    environment: {LAB_SECRET_DIR: /secrets}
    volumes: [lab_secrets:/secrets, php_key:/php-secret, php_data:/php-data]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    restart: "no"

  workstation:
    image: vulncorp-desktop:0.2.0
    build: {context: ., target: desktop}
    hostname: analisis
    networks: [edge]
    environment: {LAB_STATION: analyst, LAB_SECRET_DIR: /secrets}
    volumes: [analyst_home:/home/student, analyst_journal:/journal, station_access:/access, lab_secrets:/secrets:ro]
    read_only: true
    cap_drop: [ALL]
    cap_add: [AUDIT_WRITE, CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID, SYS_CHROOT]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=64m,mode=1777", "/run:size=32m,mode=755"]
    shm_size: 64m
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 160
    depends_on:
      init-game: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request,socket; urllib.request.urlopen('http://127.0.0.1:6080/desk.html',timeout=2); urllib.request.urlopen('http://127.0.0.1:9091/health',timeout=2); socket.create_connection(('127.0.0.1',2222),2).close()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  ops:
    image: vulncorp-station:0.2.0
    build: {context: ., target: station-base}
    hostname: soporte
    networks: [edge, support]
    environment: {LAB_STATION: ops, LAB_SECRET_DIR: /secrets}
    volumes: [ops_home:/home/student, ops_journal:/journal, station_access:/access:ro, lab_secrets:/secrets:ro]
    read_only: true
    cap_drop: [ALL]
    cap_add: [AUDIT_WRITE, CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID, SYS_CHROOT]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=32m,mode=1777", "/run:size=16m,mode=755"]
    mem_limit: 128m
    cpus: 0.50
    pids_limit: 80
    depends_on:
      workstation: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request,socket; urllib.request.urlopen('http://127.0.0.1:9091/health',timeout=2); socket.create_connection(('127.0.0.1',2222),2).close()"]
      interval: 10s
      timeout: 4s
      retries: 8
    restart: unless-stopped

  appdesk:
    extends: {service: ops}
    image: vulncorp-appdesk:0.2.0
    build: {context: ., target: appdesk}
    hostname: aplicaciones
    networks: !override [edge, app]
    environment: {LAB_STATION: appdesk, LAB_SECRET_DIR: /secrets, GRYPE_DB_CACHE_DIR: /cache, GRYPE_DB_AUTO_UPDATE: "false", GRYPE_CHECK_FOR_APP_UPDATE: "false", SYFT_CHECK_FOR_APP_UPDATE: "false"}
    volumes: !override [appdesk_home:/home/student, appdesk_journal:/journal, station_access:/access:ro, lab_secrets:/secrets:ro, grype_cache:/cache:ro]
    mem_limit: 1280m
    cpus: 2.0

  prepare-cache:
    image: vulncorp-core:0.1.0
    profiles: [tools]
    user: "0:0"
    command: [python, -c, "from pathlib import Path; p=Path('/cache'); p.chmod(0o755); [(x.chmod(0o755 if x.is_dir() else 0o644)) for x in p.rglob('*')]" ]
    volumes: [grype_cache:/cache]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    restart: "no"

  probe-public:
    <<: *common
    profiles: [tools]
    entrypoint: [python, -m, app.cli]
    command: [discover]
    environment: {LAB_ZONE: public}
    networks: [edge]
    restart: "no"
    mem_limit: 128m

  probe-support:
    <<: *common
    profiles: [tools]
    entrypoint: [python, -m, app.cli]
    command: [discover]
    environment: {LAB_ZONE: support}
    networks: [support]
    restart: "no"
    mem_limit: 128m

  check:
    <<: *common
    profiles: [tools]
    entrypoint: [python, -m, unittest, discover, -s, tests, -v]
    networks: [edge]
    restart: "no"
    environment: {LAB_DB: /tmp/tests.db}
    mem_limit: 256m

  syft:
    image: anchore/syft:v1.55.0@sha256:4cc92b64ca74ffca4c94d4c8fcc01f217731375300be14d0b6eeb2e82eaa110a
    profiles: [scanners]
    volumes: [./artifacts/images:/input:ro, syft_tmp:/tmp]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 2.0
    environment: {SYFT_CHECK_FOR_APP_UPDATE: "false", XDG_CACHE_HOME: /tmp/.cache}

  grype:
    image: anchore/grype:v0.121.0@sha256:621d56d1d68106b787022c81546f7e0a36202a25d1239f0c20195fab8c16f7ea
    profiles: [scanners]
    volumes: [./artifacts:/reports:ro, grype_cache:/cache, grype_tmp:/tmp]
    networks: [feeds]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 2.0
    environment:
      GRYPE_DB_CACHE_DIR: /cache
      GRYPE_CHECK_FOR_APP_UPDATE: "false"

  ollama:
    image: ollama/ollama:0.40.6@sha256:265409e1d931028a8f7d5a32bcbafddd7bffbc6cc629d77efe9560adf692a5e7
    profiles: [ai]
    networks: [ai]
    volumes: [ollama_models:/root/.ollama]
    mem_limit: 4g
    memswap_limit: 4g
    cpus: 2.0
    pids_limit: 128
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=128m,mode=1777"]
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_CONTEXT_LENGTH: "4096"
      OLLAMA_KEEP_ALIVE: 2m
      OLLAMA_NO_CLOUD: "1"
    healthcheck:
      test: [CMD, ollama, list]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

networks:
  ui: {}
  edge: {internal: true}
  app: {internal: true}
  support: {internal: true}
  ai: {internal: true}
  feeds: {}
  php: {internal: true}

volumes:
  php_key: {}
  php_data: {}
  zap_work: {}
  range_state: {}
  lab_secrets: {}
  analyst_home: {}
  analyst_journal: {}
  station_access: {}
  ops_home: {}
  ops_journal: {}
  appdesk_home: {}
  appdesk_journal: {}
  mission_state: {}
  ollama_models: {}
  grype_cache: {}
  syft_tmp: {}
  grype_tmp: {}
