ServerName portal.interno
ServerTokens Prod
ServerSignature Off
StartServers 1
ServerLimit 1
MinSpareServers 1
MaxSpareServers 1
MaxRequestWorkers 1
MaxConnectionsPerChild 100
Timeout 10
LimitRequestBody 16384
<Directory /var/www/html>
    AllowOverride None
    Require all granted
    FallbackResource /index.php
</Directory>
